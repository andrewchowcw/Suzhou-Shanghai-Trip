<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>苏州 · 上海之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#15112b;--bg2:#2d2040;--bg3:#4a2f4c;
  --glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.13);--line:rgba(255,255,255,.16);
  --tx:#f5eee8;--tx2:#c9bdd0;--tx3:#9488a6;
  --peach:#f4a98c;--gold:#ecc88f;--teal:#6cc3bd;--lilac:#b9a3f0;--ok:#7fd6a4;
  --nav:rgba(30,22,48,.82);--shadow:0 10px 30px rgba(0,0,0,.35);
  --serif:"Noto Serif SC","Songti SC",Georgia,serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--en:"Cormorant Garamond",Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg1:#fbeee4;--bg2:#f4dcd6;--bg3:#e6cfe0;
  --glass:rgba(255,255,255,.6);--glass2:rgba(255,255,255,.85);--line:rgba(90,50,80,.16);
  --tx:#2c1f38;--tx2:#5b4a6a;--tx3:#85748f;--peach:#c9603c;--gold:#9a6a1c;--teal:#237f7a;--lilac:#6b4fc0;--ok:#1f8a54;
  --nav:rgba(255,246,240,.88);--shadow:0 10px 26px rgba(90,50,80,.18);}}
:root[data-theme="light"]{
  --bg1:#fbeee4;--bg2:#f4dcd6;--bg3:#e6cfe0;--glass:rgba(255,255,255,.6);--glass2:rgba(255,255,255,.85);--line:rgba(90,50,80,.16);
  --tx:#2c1f38;--tx2:#5b4a6a;--tx3:#85748f;--peach:#c9603c;--gold:#9a6a1c;--teal:#237f7a;--lilac:#6b4fc0;--ok:#1f8a54;--nav:rgba(255,246,240,.88);--shadow:0 10px 26px rgba(90,50,80,.18);}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font:400 15px/1.6 var(--sans);color:var(--tx);background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg1)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--peach);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 18px 120px}
.view{display:none}.view.on{display:block}
.en{font-family:var(--en);font-style:italic;letter-spacing:.01em}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700}
/* hero */
.hero{padding:34px 4px 18px;position:relative}
.hero .kick{font-size:13px;color:var(--gold);letter-spacing:.04em}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 2px}
.hero .sub{font-family:var(--en);font-style:italic;font-weight:600;font-size:26px;color:var(--peach);line-height:1.1}
.hero .date{margin-top:12px;font-family:var(--serif);font-size:16px;color:var(--tx)}
.hero .tag{margin-top:6px;color:var(--tx2);font-size:14px}
.theme{position:absolute;right:2px;top:30px;width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:16px;display:grid;place-items:center}
/* glass */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
/* next stop */
.next{position:relative;overflow:hidden;padding:20px;min-height:176px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,rgba(244,169,140,.28),rgba(108,195,189,.2) 70%),var(--glass)}
.next.has-bg{background-size:cover;background-position:center}
.next::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,14,36,.78),rgba(20,14,36,.05) 70%);pointer-events:none;border-radius:inherit}
.next>*{position:relative;z-index:1}
.next,.next *{color:#fff}
.next .lab{font-family:var(--serif);font-size:13px;opacity:.9}
.next h2{font-size:26px;line-height:1.25;margin:2px 0}
.next .when{font-size:14px;opacity:.92}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 12px;border-radius:99px;font-size:12.5px;background:rgba(18,60,50,.7);border:1px solid rgba(127,214,164,.5);align-self:flex-start}
.pill.warn{background:rgba(70,40,20,.7);border-color:rgba(244,169,140,.6)}
/* section heads */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
.sec h2{font-size:20px}.sec h2 small{font-family:var(--en);font-style:italic;font-weight:500;font-size:17px;color:var(--tx3);margin-left:8px}
.sec button{color:var(--peach);font-size:13.5px}
/* day carousel */
.days{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dc{flex:0 0 150px;height:190px;scroll-snap-align:start;border-radius:20px;border:1px solid var(--line);position:relative;overflow:hidden;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--c1);background-size:cover;background-position:center;box-shadow:var(--shadow)}
.dc::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,10,30,.82),rgba(15,10,30,.05) 65%)}
.dc>*{position:relative;z-index:1;color:#fff}
.dc .dn{font-family:var(--en);font-style:italic;font-weight:600;font-size:15px;opacity:.9}
.dc b{font-family:var(--serif);font-size:17px;line-height:1.3;display:block}
.dc span{font-size:12px;opacity:.85}
.dc.today{outline:2px solid var(--peach)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile{padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;border-radius:18px}
.tile i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:17px}
.tile b{font-size:14.5px;font-weight:700;line-height:1.2}.tile small{color:var(--tx3);font-size:12px}
/* tickets */
.tk{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -18px;padding:2px 18px 10px;scrollbar-width:none}
.tk::-webkit-scrollbar{display:none}
.ticket{flex:0 0 200px;scroll-snap-align:start;padding:14px;border-radius:18px;text-align:left;display:flex;flex-direction:column;gap:3px}
.ticket .k{font-size:12px;color:var(--gold)}
.ticket b{font-family:var(--serif);font-size:16px;line-height:1.3}
.ticket .m{font-size:12.5px;color:var(--tx2)}
.ticket .st{margin-top:8px;font-size:12.5px;color:var(--tx3);display:flex;gap:6px;align-items:center}
.ticket.done .st{color:var(--ok)}
/* plan view */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -18px;padding:10px 18px 8px;background:linear-gradient(var(--bg1) 70%,transparent)}
.tabrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabrow::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:52px;padding:7px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);text-align:center;font-size:12px;color:var(--tx2);line-height:1.25}
.tab b{display:block;font-family:var(--serif);font-size:17px;color:var(--tx)}
.tab[aria-selected="true"]{background:var(--peach);border-color:var(--peach);color:#2a1424}.tab[aria-selected="true"] b{color:#2a1424}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{padding:5px 13px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--tx2)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#0d2a2a;font-weight:700}
.dayhead{margin:22px 0 4px}.dayhead h2{font-size:22px;line-height:1.3}.dayhead .en{font-size:18px;color:var(--peach)}
.dayhead p{margin:2px 0 0;color:var(--tx3);font-size:13px}
.tl{list-style:none;margin:10px 0 0;padding:0 0 0 22px;position:relative}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line)}
.it{position:relative;margin:0 0 12px}
.it::before{content:"";position:absolute;left:-21px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--bg2);border:2px solid var(--dot,var(--gold))}
.it.done::before{background:var(--ok);border-color:var(--ok)}
.it.now::before{background:var(--peach);border-color:var(--peach);box-shadow:0 0 0 5px rgba(244,169,140,.28)}
.card{border-radius:18px;padding:12px 14px}
.it.now .card{border-color:var(--peach)}
.row{display:flex;gap:10px;align-items:flex-start}
.row .tt{flex:1;min-width:0;text-align:left}
.time{font-size:12.5px;color:var(--gold);font-variant-numeric:tabular-nums}
.ttl{font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.4;margin:1px 0}
.it.done .ttl{text-decoration:line-through;text-decoration-color:var(--tx3);color:var(--tx2)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tg{font-size:11.5px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--tx2)}
.tg.eat{color:var(--peach)}.tg.ph{color:var(--lilac)}.tg.move{color:var(--teal)}
.chk{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--tx3);display:grid;place-items:center;color:transparent;font-size:14px}
.it.done .chk{background:var(--ok);border-color:var(--ok);color:#0b2417}
.det{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:none}
.it.open .det{display:block}
.det p{margin:0 0 5px;color:var(--tx2);font-size:14px}
.todo{margin-top:8px;padding:8px 10px;border-radius:12px;background:rgba(244,169,140,.14);border:1px solid rgba(244,169,140,.4);font-size:13.5px}
.ph-row{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.ph-row button{flex:0 0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
.ph-row img{display:block;height:130px;width:auto}
.ph-row em{position:absolute;left:0;right:0;bottom:0;padding:2px 8px;font-size:11.5px;font-style:normal;color:#fff;background:rgba(0,0,0,.5)}
.cmore{font-size:12px;color:var(--tx3);margin-left:4px}
.empty{padding:28px;text-align:center;color:var(--tx3)}
/* todo view */
.prog{height:8px;border-radius:9px;background:var(--glass2);overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ok));width:0;transition:width .3s}
.tlist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.tli{padding:14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.tli .tt{flex:1}.tli b{font-family:var(--serif);font-size:16px;display:block;line-height:1.35}.tli small{color:var(--tx2);font-size:13px;display:block}
.tli.done b{text-decoration:line-through;color:var(--tx2)}.tli.done .chk{background:var(--ok);border-color:var(--ok);color:#0b2417}
.go{color:var(--peach);font-size:12.5px;margin-top:2px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.navin{max-width:520px;margin:0 auto;display:flex;padding:6px;border-radius:26px;background:var(--nav);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);pointer-events:auto}
.navin button{flex:1;padding:7px 0 6px;border-radius:20px;color:var(--tx3);font-size:11.5px;line-height:1.3;display:flex;flex-direction:column;align-items:center}
.navin button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:1px}
.navin button[aria-current="page"]{color:var(--peach);background:var(--glass)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,5,16,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:78vh;border-radius:14px}.lb p{color:#eee;margin:10px 0 0;font-size:14px}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
  <!-- HOME -->
  <section class="view" id="v-home">
    <header class="hero">
      <button class="theme" id="theme" aria-label="切换明暗主题">◐</button>
      <div class="kick">一路慢慢逛 · 吃好看好</div>
      <h1>苏州 · 上海之旅</h1>
      <div class="sub">Suzhou &amp; Shanghai</div>
      <div class="date">11月4日 – 11月11日 · 8 天</div>
      <div class="tag">园林、水巷、江景与书店，一份可勾选的行程。</div>
    </header>
    <div id="next"></div>
    <div class="tiles" id="tiles"></div>
    <div class="sec"><h2>每日行程<small>Days</small></h2></div>
    <div class="days" id="days"></div>
    <div class="sec"><h2>我的票券<small>Your tickets</small></h2><button data-go="todo">查看全部</button></div>
    <div class="tk" id="tk"></div>
  </section>
  <!-- PLAN -->
  <section class="view" id="v-plan">
    <div class="tabs"><div class="tabrow" id="tabs" role="tablist"></div>
      <div class="chips" id="chips"></div></div>
    <div id="plan"></div>
  </section>
  <!-- TODO -->
  <section class="view" id="v-todo">
    <header class="hero" style="padding-bottom:6px"><h1 style="font-size:30px">预约与票券</h1><div class="sub" style="font-size:22px">Bookings</div></header>
    <div class="glass" style="padding:14px 16px"><div id="progtx" style="font-size:14px;color:var(--tx2)"></div><div class="prog"><i id="progbar"></i></div></div>
    <div class="tlist" id="tlist"></div>
  </section>
</main>
<nav><div class="navin" id="nav">
  <button data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首页<br><span class="en" style="font-size:13px">Home</span></button>
  <button data-go="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>行程<br><span class="en" style="font-size:13px">Itinerary</span></button>
  <button data-go="todo"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2.5"/></svg>票券<br><span class="en" style="font-size:13px">Tickets</span></button>
</div></nav>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="照片"><button id="lbx" aria-label="关闭">✕</button><img alt=""><p></p></div>

 {id:"f1",k:"航班 Flight",t:"飞往上海浦东 PVG",m:"11月4日 00:15 起飞 · 05:40 前后落地",day:0,it:0,done:false},
 {id:"t1",k:"高铁 Train",t:"上海虹桥 → 苏州站",m:"11月4日 08:52 – 09:19 · 约 27 分钟",day:0,it:3,done:true},
 {id:"b1",k:"预约 Museum",t:"苏州博物馆",m:"11月5日 10:00 · 提前 7 天预约",day:1,it:1,done:false},
 {id:"b2",k:"订位 Dining",t:"姑苏船宴（山塘街）",m:"11月6日 午餐 · 订靠窗河景桌",day:2,it:2,done:false},
 {id:"b3",k:"预约 Library",t:"朵云书院（上海中心 52 楼）",m:"11月7日 14:00 · 微信小程序预约入馆",day:3,it:3,done:false},
 {id:"f2",k:"航班 Flight",t:"返回马来西亚",m:"11月11日 09:20 – 14:40",day:7,it:1,done:false}];
const YEAR=2026,MON=10;
let S={view:"home",day:-1,f:"all",done:{},open:{}};
try{const x=JSON.parse(localStorage.getItem("sz26")||"null");if(x&&x.done)S.done=x.done}catch(e){}
function save(){try{localStorage.setItem("sz26",JSON.stringify({done:S.done}))}catch(e){}}
const $=s=>document.querySelector(s);
const isDone=id=>id in S.done?S.done[id]:(TK.find(t=>t.id===id)||{}).done||false;
const itId=(d,i)=>"i"+D[d].items[i].r;
const tm=(d,s)=>{const m=/(\d+):(\d+)/.exec(s||"");return m?new Date(YEAR,MON,D[d].d,+m[1],+m[2]):null};
function endOf(d,s){const m=/-\s*(\d+):(\d+)/.exec(s||"");return m?new Date(YEAR,MON,D[d].d,+m[1],+m[2]):null}
function locate(){ // next/now item
  const n=new Date();
  for(let d=0;d<D.length;d++)for(let i=0;i<D[d].items.length;i++){
    const it=D[d].items[i],a=tm(d,it.t),b=endOf(d,it.t);
    if(a&&b&&n>=a&&n<=b)return{d,i,now:true};
    if(a&&a>n)return{d,i,now:false,a};
    if(!a&&n.getDate()===D[d].d&&n.getMonth()===MON)return{d,i,now:true};
  }
  return null;
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function ph(r,cap){return `<button data-ph="${r}" data-cap="${esc(cap||"")}"><img src="${P[r]}" alt="${esc(cap||"照片")}" loading="lazy">${cap?`<em>${esc(cap)}</em>`:""}</button>`}
function when(a){const ms=a-new Date();if(ms<=0)return"";const h=Math.floor(ms/36e5);return h>=48?`还有 ${Math.floor(h/24)} 天`:h>=1?`还有约 ${h} 小时`:`还有 ${Math.max(1,Math.round(ms/6e4))} 分钟`}
/* HOME */
function home(){
  const L=locate();
  if(!L){$("#next").innerHTML=`<div class="glass next"><div class="lab">行程结束</div><h2>欢迎回家</h2></div>`}
  else{const day=D[L.d],it=day.items[L.i],c=COVER[L.d];
    const tk=TK.find(t=>t.day===L.d&&t.it===L.i);
    const pill=tk?`<span class="pill ${isDone(tk.id)?"":"warn"}">${isDone(tk.id)?"✓ 已搞定":"待办"} · ${esc(tk.t)}</span>`:"";
    $("#next").innerHTML=`<button class="glass next ${c?"has-bg":""}" data-open="${L.d},${L.i}" style="${c?`background-image:url(${P[c]})`:""};width:100%;text-align:left">
      <span class="lab">${L.now?"正在进行":"下一站"} · Next stop${L.a?" · "+when(L.a):""}</span>
      <h2>${esc(it.title)}</h2><span class="when">11月${day.d}日 ${esc(it.t||"全天")} · ${esc(day.place)}</span>${pill}</button>`}
  $("#tiles").innerHTML=[["plan","all","🗓","全部行程","Itinerary","rgba(244,169,140,.22)"],["todo","","🎫","预约票券","Tickets","rgba(185,163,240,.22)"],["plan","eat","🍜","美食","Eats","rgba(108,195,189,.22)"]].map(t=>`<button class="glass tile" data-t="${t[0]},${t[1]}"><i style="background:${t[5]}">${t[2]}</i><b>${t[3]}</b><small class="en" style="font-size:14px">${t[4]}</small></button>`).join("");
  const n=new Date(),td=D.findIndex(x=>x.d===n.getDate()&&n.getMonth()===MON&&n.getFullYear()===YEAR);
  $("#days").innerHTML=D.map((x,i)=>{const c=COVER[i];return `<button class="dc ${i===td?"today":""}" data-day="${i}" style="background-image:${c?`url(${P[c]})`:GR[i]}"><span class="dn">Day ${i+1}</span><b>${esc(x.place)}</b><span>${x.d} Nov · ${EN[i]}</span></button>`}).join("");
  $("#tk").innerHTML=TK.map(t=>`<button class="glass ticket ${isDone(t.id)?"done":""}" data-tk="${t.id}"><span class="k">${t.k}</span><b>${t.t}</b><span class="m">${t.m}</span><span class="st">${isDone(t.id)?"✓ 已完成":"○ 待确认"}</span></button>`).join("");
}
/* PLAN */
function itemHTML(d,i){
  const it=D[d].items[i],id=itId(d,i),L=window._L,now=L&&L.now&&L.d===d&&L.i===i;
  const tags=(it.ty==="eat"?'<span class="tg eat">美食</span>':"")+(it.ty==="move"?'<span class="tg move">交通</span>':"")+(it.ph?'<span class="tg ph">机位</span>':"");
  const has=it.n.length||it.td||it.p.length;
  return `<li class="it ${isDone(id)?"done":""} ${now?"now":""} ${S.open[id]?"open":""}" data-id="${id}" style="--dot:${it.ty==="eat"?"var(--peach)":it.ty==="move"?"var(--teal)":"var(--gold)"}">
   <div class="glass card"><div class="row"><button class="tt" data-tog="${id}" aria-expanded="${!!S.open[id]}"><div class="time">${esc(it.t||"全天")}${has?`<span class="cmore">${S.open[id]?"收起":"详情"}</span>`:""}</div><div class="ttl">${esc(it.title)}</div>${tags?`<div class="tags">${tags}</div>`:""}</button>
   <button class="chk" data-chk="${id}" aria-label="标记完成" aria-pressed="${isDone(id)}">✓</button></div>
   <div class="det">${it.n.map(l=>`<p>${esc(l)}</p>`).join("")}${it.td?`<div class="todo">待办：${esc(it.td)}</div>`:""}${it.p.length?`<div class="ph-row">${it.p.map(p=>ph(p[0],p[1])).join("")}</div>`:""}</div></div></li>`;
}
function plan(){
  window._L=locate();
  $("#tabs").innerHTML=`<button class="tab" role="tab" data-d="-1" aria-selected="${S.day===-1}"><b>全部</b>All</button>`+D.map((x,i)=>`<button class="tab" role="tab" data-d="${i}" aria-selected="${S.day===i}"><b>${x.d}</b>${x.date.match(/\((\w+)\)/)[1]}</button>`).join("");
  $("#chips").innerHTML=[["all","全部"],["eat","美食"],["ph","机位"],["move","交通"]].map(c=>`<button class="chip" data-f="${c[0]}" aria-pressed="${S.f===c[0]}">${c[1]}</button>`).join("");
  const ok=it=>S.f==="all"||(S.f==="ph"?it.ph:it.ty===S.f);
  const days=S.day===-1?D.map((_,i)=>i):[S.day];let h="";
  for(const d of days){
    const idx=D[d].items.map((it,i)=>ok(it)?i:-1).filter(i=>i>=0);
    if(S.day!==-1&&!idx.length){h+=`<div class="empty">这一天没有符合筛选的安排</div>`;continue}
    if(!idx.length)continue;
    h+=`<div class="dayhead"><div class="en">Day ${d+1} · ${EN[d]}</div><h2>${D[d].d}日 ${D[d].date.match(/\((\w+)\)/)[1]} · ${esc(D[d].place)}</h2></div><ol class="tl">${idx.map(i=>itemHTML(d,i)).join("")}</ol>`;
  }
  $("#plan").innerHTML=h||`<div class="empty">没有符合筛选的安排</div>`;
}
/* TODO */
function todo(){
  const n=TK.filter(t=>isDone(t.id)).length;
  $("#progtx").textContent=`已完成 ${n} / ${TK.length}`;$("#progbar").style.width=(n/TK.length*100)+"%";
  $("#tlist").innerHTML=TK.map(t=>`<div class="glass tli ${isDone(t.id)?"done":""}"><div class="tt"><small class="en" style="color:var(--gold)">${t.k}</small><b>${t.t}</b><small>${t.m}</small><button class="go" data-jump="${t.day},${t.it}">在行程中查看</button></div><button class="chk" data-tk="${t.id}" aria-label="标记完成" aria-pressed="${isDone(t.id)}">✓</button></div>`).join("");
}
function show(v){S.view=v;document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));
  document.querySelectorAll("#nav button").forEach(b=>{if(b.dataset.go===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(v==="home")home();if(v==="plan")plan();if(v==="todo")todo();
  if(location.hash!=="#"+v)history.replaceState(null,"","#"+v);window.scrollTo(0,0)}
function jump(d,i){S.day=d;S.f="all";S.open[itId(d,i)]=true;show("plan");const e=document.querySelector(`[data-id="${itId(d,i)}"]`);if(e)setTimeout(()=>e.scrollIntoView({block:"center"}),30)}
function toggleTk(id){S.done[id]=!isDone(id);save();render()}
function render(){show(S.view)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const g=a=>t.dataset[a];
  if(g("go"))return show(g("go"));
  if(g("t")){const[v,f]=g("t").split(",");if(v==="plan"){S.day=-1;S.f=f||"all"}return show(v)}
  if(g("day")!==undefined){S.day=+g("day");S.f="all";return show("plan")}
  if(g("open")){const[d,i]=g("open").split(",").map(Number);return jump(d,i)}
  if(g("jump")){const[d,i]=g("jump").split(",").map(Number);return jump(d,i)}
  if(g("tk"))return toggleTk(g("tk"));
  if(g("d")){S.day=+g("d");plan();return window.scrollTo(0,0)}
  if(g("f")){S.f=g("f");return plan()}
  if(g("tog")){S.open[g("tog")]=!S.open[g("tog")];return plan()}
  if(g("chk")){S.done[g("chk")]=!isDone(g("chk"));save();return plan()}
  if(g("ph")){const l=$("#lb");l.querySelector("img").src=P[g("ph")];l.querySelector("p").textContent=g("cap")||"";l.classList.add("on");return}
  if(t.id==="lbx")return $("#lb").classList.remove("on");
  if(t.id==="theme"){const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg1").trim()==="#15112b";r.setAttribute("data-theme",dark?"light":"dark")}
});
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")e.currentTarget.classList.remove("on")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#lb").classList.remove("on")});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["home","plan","todo"].includes(v)&&v!==S.view)show(v)});
const h0=location.hash.slice(1);show(["home","plan","todo"].includes(h0)?h0:"home");
</script>
</body>
</html>
